[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "project-cinderella"
version = "0.1.0"
description = "AI-powered early detection of breakout self-published books"
authors = ["Carly Kleinbart"]
readme = "README.md"
packages = [{include = "config"}, {include = "database"}, {include = "models"}, {include = "scrapers"}, {include = "collectors"}, {include = "scoring"}, {include = "alerts"}, {include = "reports"}]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg2-binary = "^2.9"
playwright = "^1.44"
pydantic = "^2.7"
pydantic-settings = "^2.3"
pandas = "^2.2"
httpx = "^0.27"
loguru = "^0.7"
tenacity = "^8.3"
python-dotenv = "^1.0"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
apscheduler = "^3.10"
rich = "^13.7"
click = "^8.1"
beautifulsoup4 = "^4.12"
lxml = "^5.2"
praw = "^7.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
black = "^24.4"
ruff = "^0.4"
mypy = "^1.10"
factory-boy = "^3.3"
respx = "^0.21"

[tool.poetry.scripts]
cinderella-collect = "scripts.collect:main"
cinderella-seed = "scripts.seed_publishers:main"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing --cov-omit=tests/*,alembic/*"
